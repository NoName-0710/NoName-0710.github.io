var bgImg=null;
var entities=[];
function entityHH(hw){
if(C.assetType==="dvd")return hw/DVD_AR;
if(C.assetType==="image"&&custImg&&custImg.naturalWidth)return hw/(custImg.naturalWidth/custImg.naturalHeight);
return 55*C.scale/2+8;
}
function spawn(){
entities.length=0;
for(var i=0;i<C.count;i++){
var hw=90*C.scale,hh=entityHH(hw);
var a=(25+Math.random()*40)*Math.PI/180;
var sx=Math.random()<.5?1:-1,sy=Math.random()<.5?1:-1;
entities.push({x:hw+Math.random()*(sz.w-hw*2),y:hh+Math.random()*(sz.h-hh*2),
vx:Math.cos(a)*2.5*sx,vy:Math.sin(a)*2.5*sy,hw:hw,hh:hh,
color:(C.colorize&&C.colorFlashOnImpact)?NEON[Math.floor(Math.random()*NEON.length)]:C.assetColor});
}
}
function initEntities(){spawn();draw();}
if(C.assetType==="image"&&custImg){
if(custImg.complete&&custImg.naturalWidth){initEntities();}
else{custImg.onload=initEntities;custImg.onerror=initEntities;}
}else{initEntities();}
var mx=0,my=0;
document.addEventListener("mousemove",function(e){
var r=canvas.getBoundingClientRect();
mx=(e.clientX-r.left)*(sz.w/r.width);
my=(e.clientY-r.top)*(sz.h/r.height);
});
var actx=null,started=false;
function begin(){
if(started)return;
started=true;
if(C.soundOn){
try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
}
var p=document.getElementById("sndp");
if(p)p.remove();
requestAnimationFrame(loop);
}
document.addEventListener("click",begin);
document.addEventListener("touchstart",begin);
function playSound(){
if(!C.soundOn||!actx)return;
try{
var osc=actx.createOscillator(),gain=actx.createGain();
osc.connect(gain);gain.connect(actx.destination);osc.type="square";
var f=[220,277,330,370,440][Math.floor(Math.random()*5)];
osc.frequency.setValueAtTime(f,actx.currentTime);
gain.gain.setValueAtTime(0.06,actx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.12);
osc.start(actx.currentTime);osc.stop(actx.currentTime+0.12);
}catch(e){}
}
function cycleColor(e){
if(!C.colorize||!C.colorFlashOnImpact)return;
var c=NEON.filter(function(x){return x!==e.color;});
e.color=c[Math.floor(Math.random()*c.length)];
}
var paused=false;
document.addEventListener("keydown",function(e){
var wasStarted=started;
begin();
if(wasStarted&&e.code==="Space"&&e.target===document.body){e.preventDefault();paused=!paused;}
});
function update(){
for(var i=0;i<entities.length;i++){
var e=entities[i];
if(C.cursorGravity){
var dx=mx-e.x,dy=my-e.y,dsq=dx*dx+dy*dy;
if(dsq>=100){
var d=Math.sqrt(dsq),f=Math.min(4000/dsq,0.6);
e.vx+=dx/d*f;e.vy+=dy/d*f;
var spd=Math.sqrt(e.vx*e.vx+e.vy*e.vy);
if(spd>6){e.vx=e.vx/spd*6;e.vy=e.vy/spd*6;}
}
}
e.x+=e.vx*C.speed;e.y+=e.vy*C.speed;
var hit=false;
if(e.x-e.hw<=0){e.x=e.hw;e.vx=Math.abs(e.vx);hit=true;}
else if(e.x+e.hw>=sz.w){e.x=sz.w-e.hw;e.vx=-Math.abs(e.vx);hit=true;}
if(e.y-e.hh<=0){e.y=e.hh;e.vy=Math.abs(e.vy);hit=true;}
else if(e.y+e.hh>=sz.h){e.y=sz.h-e.hh;e.vy=-Math.abs(e.vy);hit=true;}
if(hit){cycleColor(e);playSound();}
}
if(C.mutualCollision&&entities.length>1){
for(var i=0;i<entities.length;i++){
for(var j=i+1;j<entities.length;j++){
var a=entities[i],b=entities[j];
if(Math.abs(a.x-b.x)<a.hw+b.hw&&Math.abs(a.y-b.y)<a.hh+b.hh){
var tvx=a.vx,tvy=a.vy;a.vx=b.vx;a.vy=b.vy;b.vx=tvx;b.vy=tvy;
var dx=b.x-a.x||1,dy=b.y-a.y||1,d=Math.sqrt(dx*dx+dy*dy);
a.x-=dx/d*3;a.y-=dy/d*3;b.x+=dx/d*3;b.y+=dy/d*3;
cycleColor(a);cycleColor(b);
}
}
}
}
}
function getGlowSprite(color){
if(!logoMask||!logoBuf)return null;
var cached=glowSprites[color];
if(cached)return cached;
var w=logoBuf.width,h=logoBuf.height;
var bc=logoBuf.getContext("2d");
bc.clearRect(0,0,w,h);
bc.fillStyle=color;
bc.fillRect(0,0,w,h);
bc.globalCompositeOperation="destination-in";
bc.drawImage(logoMask,0,0);
bc.globalCompositeOperation="source-over";
var pad=27;
var sprite=document.createElement("canvas");
sprite.width=w+pad*2;sprite.height=h+pad*2;
var sc=sprite.getContext("2d");
sc.shadowColor=color;sc.shadowBlur=18;
sc.drawImage(logoBuf,pad,pad);
var result={sprite:sprite,w:w,h:h};
glowSprites[color]=result;
return result;
}
function drawDVD(e){
var glow=getGlowSprite(e.color);
if(!glow)return;
var dw=e.hw*2,scale=dw/glow.w;
ctx.drawImage(glow.sprite,-glow.sprite.width/2*scale,-glow.sprite.height/2*scale,glow.sprite.width*scale,glow.sprite.height*scale);
}
function drawText(e){
var fs=55*C.scale;
ctx.fillStyle=e.color;
ctx.shadowColor=e.color;ctx.shadowBlur=20;
ctx.font="bold "+fs+"px 'Inter', sans-serif";
ctx.textAlign="center";ctx.textBaseline="middle";
ctx.fillText(C.customText,0,0);
e.hw=ctx.measureText(C.customText).width/2+8;
e.hh=fs/2+8;
}
function drawCustImg(e){
if(!custImg||!custImg.complete||!custImg.naturalWidth)return;
var aspect=custImg.naturalWidth/custImg.naturalHeight;
var dw=e.hw*2,dh=dw/aspect;
e.hh=dh/2;
if(C.colorize&&C.assetAlpha>0){
var iw=custImg.naturalWidth,ih=custImg.naturalHeight;
if(!imgBuf||imgBuf.width!==iw||imgBuf.height!==ih){imgBuf=document.createElement("canvas");imgBuf.width=iw;imgBuf.height=ih;}
var bc=imgBuf.getContext("2d");
var r=parseInt(e.color.slice(1,3),16),g=parseInt(e.color.slice(3,5),16),b=parseInt(e.color.slice(5,7),16);
bc.clearRect(0,0,iw,ih);
bc.globalCompositeOperation="source-over";bc.globalAlpha=1;
bc.drawImage(custImg,0,0);
bc.globalCompositeOperation="source-atop";bc.globalAlpha=C.assetAlpha;
bc.fillStyle="rgba("+r+","+g+","+b+",1)";bc.fillRect(0,0,iw,ih);
bc.globalCompositeOperation="source-over";bc.globalAlpha=1;
ctx.globalAlpha=C.assetImageAlpha;
ctx.drawImage(imgBuf,-dw/2,-dh/2,dw,dh);
}else{
ctx.globalAlpha=C.assetImageAlpha;
ctx.drawImage(custImg,-dw/2,-dh/2,dw,dh);
}
}
function drawCRT(){
ctx.save();
ctx.fillStyle="rgba(0,0,0,0.16)";
for(var y=0;y<sz.h;y+=3)ctx.fillRect(0,y,sz.w,1);
var vg=ctx.createRadialGradient(sz.w/2,sz.h/2,sz.h*0.35,sz.w/2,sz.h/2,sz.h*0.75);
vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,0.5)");
ctx.fillStyle=vg;ctx.fillRect(0,0,sz.w,sz.h);
ctx.restore();
}
function draw(){
ctx.clearRect(0,0,sz.w,sz.h);
if(C.bgAlpha>0){
var r=parseInt(C.bgColor.slice(1,3),16);
var g=parseInt(C.bgColor.slice(3,5),16);
var b=parseInt(C.bgColor.slice(5,7),16);
ctx.fillStyle="rgba("+r+","+g+","+b+","+C.bgAlpha+")";
ctx.fillRect(0,0,sz.w,sz.h);
}
if(bgImg&&bgImg.complete&&bgImg.naturalWidth){
ctx.save();ctx.globalAlpha=C.bgImageAlpha;ctx.drawImage(bgImg,0,0,sz.w,sz.h);ctx.restore();
}
for(var i=0;i<entities.length;i++){
var e=entities[i];
ctx.save();ctx.translate(e.x,e.y);if(C.assetType!=="image")ctx.globalAlpha=C.assetAlpha;ctx.shadowBlur=0;
if(C.assetType==="image")drawCustImg(e);
else if(C.assetType==="text")drawText(e);
else drawDVD(e);
if(C.showBoundingBox){
ctx.shadowBlur=0;ctx.strokeStyle=e.color;
ctx.lineWidth=Math.max(2,e.hw*0.025);
ctx.setLineDash([8,5]);ctx.strokeRect(-e.hw,-e.hh,e.hw*2,e.hh*2);
ctx.setLineDash([]);
}
ctx.restore();
}
if(C.showCRT)drawCRT();
}
function loop(){if(!paused)update();draw();requestAnimationFrame(loop);}</script></body></html>
